name: Static security checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JavaScript and security invariants
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          html = Path('index.html').read_text(encoding='utf-8')
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.scripts = []
                  self.external = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      attrs = dict(attrs)
                      if 'src' in attrs:
                          self.external.append(attrs['src'])
                      else:
                          self.in_script = True
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.in_script = False
              def handle_data(self, data):
                  if self.in_script:
                      self.scripts.append(data)
          parser = Scripts()
          parser.feed(html)
          assert parser.scripts, 'Missing application JavaScript'
          assert 'function escapeHtml(value)' in html, 'Missing HTML escaping'
          for i in range(8):
              assert 'escapeHtml(f[' + str(i) + '])' in html, f'Finding field {i} not escaped'
          assert 'noopener,noreferrer' in html, 'PDF window must not retain opener'
          assert 'name="referrer" content="no-referrer"' in html, 'Missing referrer restriction'
          assert all(url.startswith('https://') for url in parser.external), 'Non-HTTPS script detected'
          with tempfile.TemporaryDirectory() as directory:
              for i, script in enumerate(parser.scripts):
                  path = Path(directory) / f'inline-{i}.js'
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print('JavaScript syntax and security invariants passed')
          print('External scripts:', parser.external)
          PY
